name: Publish to NPM
on:
  release:
    types: [created]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # No registry-url: it writes an .npmrc with a placeholder _authToken,
          # which makes npm attempt (failing) token auth instead of OIDC.
          # npm publishes to registry.npmjs.org by default via Trusted Publishing.

      - name: Update npm (Trusted Publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish package on NPM 📦
        # No NODE_AUTH_TOKEN: auth happens via OIDC Trusted Publishing.
        # Requires a trusted publisher for this package on npmjs.com
        # (scraiber/hocuspocus-extension-valkey, workflow publish.yml) and a
        # repository field in package.json for provenance.
        run: npm publish

      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: ${{ job.status }}
